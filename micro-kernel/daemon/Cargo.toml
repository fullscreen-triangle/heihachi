[workspace]

[package]
name = "heihachi-daemon"
version = "0.1.0"
edition = "2021"
description = "Local runtime graph daemon and CLI for the heihachi micro-kernel"
license = "MIT"

[[bin]]
name = "heihachi"
path = "src/main.rs"

[dependencies]
# async runtime and http
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-util = "0.3"

# serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cli
clap = { version = "4", features = ["derive"] }

# filesystem watching for FL exports
notify = "6"
notify-debouncer-full = "0.3"

# audio decoding for analysis rungs
hound = "3.5"
rustfft = "6"

# outbound http to ollama
reqwest = { version = "0.11", features = ["json"] }

# misc
rand = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
byteorder = "1"
clack-host = "0.1.1"
clack-extensions = { version = "0.1.1", features = ["clack-host", "params"] }

[profile.release]
opt-level = 3
lto = true
